# Docker Compose for Secondsight.
#
# Brings up the interactive Gradio Re-ID demo on http://localhost:7860. The port
# is published on the host loopback interface only, because the demo has no
# authentication by default. Weights and the dataset are mounted read-only from
# the host so the image stays lean and stateless.
#
# Usage:
#   docker compose up --build
# then open http://localhost:7860
#
# Put a trained checkpoint at ./outputs/model_final.pth. For gallery search, point
# SECONDSIGHT_DATA_DIR at the host folder that directly contains
# bounding_box_test/ (the path printed by `make download`). Both host paths can
# be set in a local .env file, which compose reads automatically; see
# .env.example. The in-container paths below are fixed and should not change.

services:
  demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: secondsight:latest
    container_name: reid-demo
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      REID_WEIGHTS: /app/outputs/model_final.pth
      REID_DATA_ROOT: /app/data
      GRADIO_SERVER_NAME: "0.0.0.0"
      GRADIO_SERVER_PORT: "7860"
    volumes:
      # Trained weights and run artifacts (model_final.pth, optional best.pth, logs).
      - ${SECONDSIGHT_OUTPUTS_DIR:-./outputs}:/app/outputs:ro
      # Optional: the Market-1501 dataset root for gallery browsing.
      - ${SECONDSIGHT_DATA_DIR:-./data}:/app/data:ro
    restart: unless-stopped
