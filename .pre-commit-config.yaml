# Pre-commit hooks for the Secondsight project.
# Install with: pre-commit install
# Run on all files with: pre-commit run --all-files
# CI runs these same hooks, so this file is the single source of truth for the
# ruff version (keep it equal to the ruff pin in the dev extra of pyproject.toml).
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^uv\.lock$
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        name: ruff (lint)
        args: [--fix]
      - id: ruff-format
        name: ruff (format)
        types_or: [python, pyi]
