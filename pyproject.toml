[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "Secondsight"
dynamic = ["version"]
description = "Production-grade Person Re-Identification (Re-ID) on the Market-1501 dataset."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vardh Jain", email = "vardhjain20@gmail.com" }]
maintainers = [{ name = "Vardh Jain", email = "vardhjain20@gmail.com" }]
keywords = [
    "person-re-identification",
    "re-id",
    "market-1501",
    "computer-vision",
    "deep-learning",
    "pytorch",
    "metric-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "numpy>=1.24",
    "pillow>=10.3",
    "pyyaml>=6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Figures and analysis (reid.visualization, reid-visualize).
viz = [
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
    "opencv-python-headless>=4.8",
]
# Interactive Gradio demo (app/gradio_app.py).
demo = ["gradio>=5.50"]
# Dataset download helper (reid-download).
data = ["kagglehub>=1.0.2"]
all = ["Secondsight[viz,demo,data]"]
dev = [
    "ruff==0.16.10",
    "pytest>=9",
    "pytest-cov>=5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]
# uv-only torch selectors. "uv sync --extra cpu" installs CPU wheels from the
# PyTorch CPU index (used by CI and Docker); "--extra cuda" or no selector keeps
# the default PyPI wheels, which include CUDA support on Linux.
cpu = ["torch>=2.3", "torchvision>=0.18"]
cuda = ["torch>=2.3", "torchvision>=0.18"]

[project.urls]
Homepage = "https://github.com/vardhjain/Secondsight"
Repository = "https://github.com/vardhjain/Secondsight"
Issues = "https://github.com/vardhjain/Secondsight/issues"
Documentation = "https://github.com/vardhjain/Secondsight/blob/main/README.md"

[project.scripts]
reid-download = "reid.cli.download:main"
reid-train = "reid.cli.train:main"
reid-evaluate = "reid.cli.evaluate:main"
reid-visualize = "reid.cli.visualize:main"

[tool.hatch.version]
path = "src/reid/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/reid"]

# Ship the YAML recipes inside the package so installed CLIs find their default
# config through importlib.resources.
[tool.hatch.build.targets.wheel.force-include]
"configs" = "reid/configs"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/scripts",
    "/configs",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CITATION.cff",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests", "app"]
extend-exclude = ["notebooks", "*.ipynb", "space"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "D",    # pydocstyle
]
ignore = [
    "D104",  # missing docstring in public package
    "D107",  # missing docstring in __init__ (documented at class level)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]
"app/**" = ["D"]
"src/reid/__init__.py" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the src-layout ``reid`` package importable during tests without requiring
# an editable install (``pip install -e .``). Pytest prepends these to sys.path.
pythonpath = ["src", "."]
minversion = "9.0"
strict = true
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true
files = ["src/reid"]

[tool.coverage.run]
source = ["reid", "app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.uv]
required-version = ">=0.11.21"
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
